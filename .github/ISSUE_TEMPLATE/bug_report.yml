name: Bug report
description: Something in waypoint-service-kit does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. **A security problem must not be reported here**: follow
        .github/SECURITY.md instead. Never paste a token, a password or personal data.

  - type: input
    id: task
    attributes:
      label: Waypoint task
      description: The task id, if one already tracks this bug.
      placeholder: WAY-482

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the exact error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The expected behavior, and the contract or document that defines it.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install this package version in a consumer
        2. Call this function with these arguments
        3. ...
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@waypoint/nest-common'
        - '@waypoint/nest-messaging'
        - '@waypoint/nest-testing'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The package version you installed.
      placeholder: v1.4.2

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with secrets removed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: This report contains no secret, token or personal data.
          required: true
